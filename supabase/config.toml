
[functions.join]
verify_jwt = false
import_map = "./functions/join/deno.json"
entrypoint = "./functions/join/index.ts"

[functions.export-tasks]
verify_jwt = false
import_map = "./functions/export-tasks/deno.json"
entrypoint = "./functions/export-tasks/index.ts"

[functions.export-events]
verify_jwt = false
import_map = "./functions/export-events/deno.json"
entrypoint = "./functions/export-events/index.ts"

[functions.generate-invite]
verify_jwt = false
entrypoint = "./functions/generate-invite/index.ts"

[functions.redeem-invite]
verify_jwt = false
entrypoint = "./functions/redeem-invite/index.ts"

[functions.test]
enabled = true
verify_jwt = true
import_map = "./functions/test/deno.json"
entrypoint = "./functions/test/index.ts"

[functions.send-notification]
verify_jwt = true
import_map = "./functions/send-notification/deno.json"
entrypoint = "./functions/send-notification/index.ts"

# Webhook target — called only from the Supabase database trigger on announcement INSERT.
# JWT verification is disabled because the caller is the Supabase trigger itself, not a user.
[functions.webhook-announcement-notification]
verify_jwt = false
import_map = "./functions/webhook-announcement-notification/deno.json"
entrypoint = "./functions/webhook-announcement-notification/index.ts"
